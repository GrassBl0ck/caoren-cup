name: Friberg game

on:
  pull_request:
    paths:
      - "friberg-game/**"
      - ".github/workflows/friberg-game.yml"
  push:
    branches:
      - main
      - "feat/v1.10-friberg"
    paths:
      - "friberg-game/**"
      - ".github/workflows/friberg-game.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: friberg_test
          POSTGRES_PASSWORD: friberg_test
          POSTGRES_DB: friberg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U friberg_test -d friberg_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: friberg-game
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.13.1
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: friberg-game/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Test PostgreSQL migrations and question bank
        env:
          TEST_DATABASE_URL: postgresql://friberg_test:friberg_test@127.0.0.1:5432/friberg_test
        run: pnpm --filter server exec vitest run test/db/migrations.postgres.test.ts test/services/questionBank/postgres.integration.test.ts --no-file-parallelism
      - run: pnpm build
